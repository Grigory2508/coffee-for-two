name: Deploy server (Supabase + bot)

# Выкладывает функции api и bot в Supabase, задаёт им секреты и вешает вебхук бота.
# Запуск: вкладка Actions → «Deploy server» → Run workflow. Также сам запускается
# при изменениях в supabase/ (если секреты уже заданы).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**', 'src/core/**']

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF(variable)"
          [ -z "${{ secrets.BOT_TOKEN }}" ] && missing="$missing BOT_TOKEN(secret)"
          [ -z "${{ vars.BOT_USERNAME }}" ] && missing="$missing BOT_USERNAME(variable)"
          if [ -n "$missing" ]; then
            echo "::warning::Сервер не выложен — не заданы:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          # Зафиксированная версия: в 3.x поменялись флаги (--remote, --yes)
          version: 3.0.0

      - name: Set function secrets
        if: steps.cfg.outputs.ready == 'true'
        run: |
          supabase secrets set --remote="$PROJECT_REF" --yes \
            BOT_TOKEN="${{ secrets.BOT_TOKEN }}" \
            BOT_USERNAME="${{ vars.BOT_USERNAME }}" \
            APP_SHORTNAME="${{ vars.APP_SHORTNAME || 'play' }}" \
            WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}" \
            CRON_SECRET="${{ secrets.CRON_SECRET }}" \
            ALLOW_DEBUG="${{ vars.ALLOW_DEBUG || '0' }}"

      - name: Deploy functions
        if: steps.cfg.outputs.ready == 'true'
        run: |
          supabase functions deploy api --remote="$PROJECT_REF" --no-verify-jwt --use-api --yes
          supabase functions deploy bot --remote="$PROJECT_REF" --no-verify-jwt --use-api --yes

      - name: Set bot webhook
        if: steps.cfg.outputs.ready == 'true'
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook" \
            -H 'Content-Type: application/json' \
            -d "{\"url\":\"https://${PROJECT_REF}.supabase.co/functions/v1/bot\",\"secret_token\":\"${{ secrets.WEBHOOK_SECRET }}\",\"allowed_updates\":[\"message\",\"inline_query\",\"pre_checkout_query\",\"my_chat_member\"]}" \
            | tee /tmp/webhook.json
          grep -q '"ok":true' /tmp/webhook.json

      - name: Check API responds
        if: steps.cfg.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /tmp/api.json -w '%{http_code}' -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/api" -H 'Content-Type: application/json' -d '{"op":"load"}')
          cat /tmp/api.json; echo
          # Без подписи Telegram функция должна ответить 401 — значит, она жива и проверяет доступ
          [ "$code" = "401" ] || { echo "::error::API ответил $code вместо 401"; exit 1; }
