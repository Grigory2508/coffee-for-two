name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Server core is in sync with src/core
        run: npm run sync-server && git diff --exit-code supabase/functions/_shared/core
      - run: npm run build
        env:
          # Задаются в Settings → Secrets and variables → Actions → Variables
          VITE_BOT_USERNAME: ${{ vars.BOT_USERNAME }}
          VITE_APP_SHORTNAME: ${{ vars.APP_SHORTNAME }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          VITE_DEBUG: ${{ vars.DEBUG }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
