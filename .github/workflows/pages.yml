name: Deploy to GitHub Pages

# Сборка выкладывается в ветку gh-pages: так Pages включается сам,
# без ручной настройки источника в Settings → Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Server core is in sync with src/core
        run: npm run sync-server && git diff --exit-code supabase/functions/_shared/core
      - run: npm run build
        env:
          # Задаются в Settings → Secrets and variables → Actions → Variables
          VITE_BOT_USERNAME: ${{ vars.BOT_USERNAME }}
          VITE_APP_SHORTNAME: ${{ vars.APP_SHORTNAME }}
          VITE_API_URL: ${{ vars.API_URL || (vars.SUPABASE_PROJECT_REF && format('https://{0}.supabase.co/functions/v1/api', vars.SUPABASE_PROJECT_REF)) || '' }}
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          VITE_DEBUG: ${{ vars.DEBUG }}
      - name: Publish to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "deploy ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
